<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section ref="{{ rootRef }}" aria-labelledby="hero-title" style="position:relative;min-height:100vh;background:#1C1A17;color:#F4F1EA;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 132px;overflow:hidden">
  <h1 id="hero-title" style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Pulse — a camera that watches when no one else can</h1>

  <span ref="{{ glowRef }}" aria-hidden="true" style="position:absolute;left:50%;top:46%;width:460px;height:460px;transform:translate(-50%,-50%);border-radius:999px;background:radial-gradient(circle,rgba(245,200,107,0.22) 0%,rgba(245,200,107,0.10) 38%,rgba(245,200,107,0) 70%);opacity:0.3;pointer-events:none"></span>

  <div ref="{{ gridRef }}" aria-hidden="true" style="position:relative;display:grid;grid-template-columns:repeat(24,11px);grid-auto-rows:11px;gap:2px"></div>

  <div ref="{{ copyRef }}" style="position:relative;margin-top:56px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity 2400ms cubic-bezier(0.37,0,0.63,1)">
    <p style="margin:0;max-width:26ch;text-align:center;font:500 clamp(24px,3.4vw,34px)/1.25 'General Sans',system-ui,sans-serif;letter-spacing:-0.025em">A camera that watches when no one else can.</p>
  </div>

  <span ref="{{ cueRef }}" aria-hidden="true" style="position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0.3">
    <span style="font:400 10px/1 'Space Mono',monospace;letter-spacing:0.24em;color:rgba(244,241,234,0.7)">SCROLL</span>
    <span style="display:block;width:1px;height:46px;background:linear-gradient(180deg,rgba(244,241,234,0.55),rgba(244,241,234,0))"></span>
  </span>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:760}}">
const AMBER = '#F5C86B', AMBER_DIM = '#8A7043';
const EASE = 'cubic-bezier(0.37,0,0.63,1)';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.rootRef = React.createRef();
    this.gridRef = React.createRef();
    this.copyRef = React.createRef();
    this.glowRef = React.createRef();
    this.cueRef = React.createRef();
    this.grid = null;
    this.blink = 1; this.blinkAt = 0; this.blinking = 0;
    this.bright = 0.30; this.brightT = 0.30;
    this.mouse = { cx: 0, cy: 0 };
    this.eye = { x: 0, y: 0, tx: 0, ty: 0 };
    this.awake = false;
    this.lastInput = Date.now();
    this.time = 0;
  }

  makeGrid(el, n, glow) {
    if (!el || el.dataset.built) return null;
    el.dataset.built = '1';
    const cells = [];
    for (let i = 0; i < n * n; i++) {
      const d = document.createElement('span');
      d.style.cssText = 'display:block;width:100%;height:100%;border-radius:1px;background:' + AMBER_DIM + ';opacity:.12;transition:opacity .22s ' + EASE + ',background-color .22s ' + EASE;
      el.appendChild(d);
      cells.push(d);
    }
    return { el, n, cells, prev: new Float32Array(n * n), buf: new Float32Array(n * n), glow: glow !== false };
  }

  paint(g, buf, bright) {
    if (!g) return;
    const cells = g.cells, prev = g.prev;
    for (let i = 0; i < cells.length; i++) {
      const v = clamp(buf[i] * bright, 0, 1);
      if (Math.abs(v - prev[i]) < 0.015) continue;
      prev[i] = v;
      const c = cells[i];
      if (v > 0.05) {
        c.style.backgroundColor = AMBER;
        c.style.opacity = v.toFixed(2);
        c.style.boxShadow = g.glow ? '0 0 ' + (7 * v).toFixed(1) + 'px rgba(245,200,107,' + (0.5 * v).toFixed(2) + ')' : 'none';
      } else {
        c.style.backgroundColor = AMBER_DIM;
        c.style.opacity = '0.12';
        c.style.boxShadow = 'none';
      }
    }
  }

  face(g, opts) {
    const n = g.n, buf = g.buf;
    buf.fill(0);
    const set = (x, y, v) => {
      x = Math.round(x); y = Math.round(y);
      if (x < 0 || y < 0 || x >= n || y >= n) return;
      const i = y * n + x;
      if (v > buf[i]) buf[i] = v;
    };
    const s = n / 24;
    const eyeR = Math.max(1, Math.round(1 * s));
    const cy = 8 * s + (opts.dy || 0) * s;
    const flat = opts.flat || 0;
    const blink = clamp(opts.blink || 0, 0, 1);
    const open = Math.round(eyeR * (1 - blink));

    for (const cxBase of [7 * s, 16 * s]) {
      const cx = cxBase + (opts.dx || 0) * s;
      for (let ex = -eyeR; ex <= eyeR; ex++)
        for (let ey = -open; ey <= open; ey++)
          set(cx + ex, cy + ey, 1);
    }

    const x0 = 6 * s, x1 = 17 * s, span = x1 - x0;
    for (let x = x0; x <= x1; x += 1) {
      const t = span === 0 ? 0 : (x - x0) / span;
      const ySmile = 14 * s + 2.4 * s * Math.sin(Math.PI * t);
      const yFlat = 15.2 * s;
      const y = lerp(ySmile, yFlat, flat);
      const yf = Math.floor(y), fr = y - yf;
      set(x, yf, 1 - fr * 0.55);
      if (fr > 0.15) set(x, yf + 1, fr);
    }
  }

  fitHero() {
    const g = this.grid;
    if (!g || !g.el) return;
    const root = this.rootRef.current;
    let avail = window.innerHeight;
    if (root) {
      const hdr = document.querySelector('header');
      const hh = hdr ? Math.round(hdr.getBoundingClientRect().height) : 0;
      avail = Math.max(360, window.innerHeight - hh);
      root.style.minHeight = avail + 'px';
      root.style.paddingTop = (avail < 620 ? 30 : 48) + 'px';
      root.style.paddingBottom = (avail < 620 ? 96 : 132) + 'px';
    }
    const cell = clamp(Math.floor((avail * 0.42 - 46) / 24), 6, 11);
    const cue = this.cueRef.current;
    if (cue) {
      const rule = cue.lastElementChild;
      if (rule) rule.style.height = (avail < 620 ? 28 : 46) + 'px';
      cue.style.bottom = (avail < 620 ? 26 : 36) + 'px';
    }
    if (this.heroCell === cell) return;
    this.heroCell = cell;
    g.el.style.gridTemplateColumns = 'repeat(24, ' + cell + 'px)';
    g.el.style.gridAutoRows = cell + 'px';
    if (this.copyRef.current) this.copyRef.current.style.marginTop = (cell < 10 ? 30 : 56) + 'px';
    const glow = this.glowRef.current;
    if (glow) { const sz = Math.round(460 * (cell / 11)); glow.style.width = sz + 'px'; glow.style.height = sz + 'px'; }
  }

  wake() {
    if (this.awake) return;
    this.awake = true;
    this.brightT = 1;
    if (this.copyRef.current) this.copyRef.current.style.opacity = '1';
  }

  componentDidMount() {
    this.grid = this.makeGrid(this.gridRef.current, 24, true);
    this.rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.fitHero();
    this.onResize = () => this.fitHero();
    window.addEventListener('resize', this.onResize);

    if (this.rm) {
      this.awake = true; this.bright = 1; this.blink = 0;
      this.face(this.grid, { dx: 0, dy: 0, blink: 0, flat: 0 });
      this.paint(this.grid, this.grid.buf, 1);
      if (this.copyRef.current) this.copyRef.current.style.opacity = '1';
      if (this.glowRef.current) this.glowRef.current.style.opacity = '0.6';
      if (this.cueRef.current) this.cueRef.current.style.opacity = '0.7';
      return;
    }

    this.onAny = () => { this.lastInput = Date.now(); this.wake(); };
    this.onMove = e => { this.lastInput = Date.now(); this.wake(); this.mouse.cx = e.clientX; this.mouse.cy = e.clientY; };
    window.addEventListener('pointermove', this.onMove, { passive: true });
    window.addEventListener('scroll', this.onAny, { passive: true });
    window.addEventListener('keydown', this.onAny);
    this.wakeTimer = setTimeout(() => this.wake(), 4500);

    this.loop = () => { this.frame(); this.raf = requestAnimationFrame(this.loop); };
    this.frame();
    this.raf = requestAnimationFrame(this.loop);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearTimeout(this.wakeTimer);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('pointermove', this.onMove);
    window.removeEventListener('scroll', this.onAny);
    window.removeEventListener('keydown', this.onAny);
  }

  frame() {
    const now = Date.now();
    this.time += 1 / 60;
    const idle = this.awake && (now - this.lastInput > 30000);

    if (now > this.blinkAt) { this.blinking = 1; this.blinkAt = now + 4000 + Math.random() * 4000; }
    if (this.blinking > 0) { this.blinking -= 1 / 14; if (this.blinking < 0) this.blinking = 0; }

    const closed = idle || !this.awake;
    const target = closed ? 1 : Math.sin(clamp(this.blinking, 0, 1) * Math.PI);
    this.blink = lerp(this.blink, target, closed ? 0.05 : 0.35);

    if (this.grid && this.grid.el) {
      const rect = this.grid.el.getBoundingClientRect();
      const dx = (this.mouse.cx - (rect.left + rect.width / 2)) / (window.innerWidth / 2);
      const dy = (this.mouse.cy - (rect.top + rect.height / 2)) / (window.innerHeight / 2);
      this.eye.tx = clamp(dx * 2.2, -2, 2);
      this.eye.ty = clamp(dy * 1.6, -1.5, 1.5);
    }
    this.eye.x = lerp(this.eye.x, this.eye.tx, 0.35);
    this.eye.y = lerp(this.eye.y, this.eye.ty, 0.35);

    const breath = 0.5 + 0.5 * Math.sin(this.time * 2 * Math.PI / 10);
    this.brightT = !this.awake ? 0.30 : idle ? 0.34 : 0.86 + 0.14 * breath;
    this.bright = lerp(this.bright, this.brightT, 0.05);

    this.face(this.grid, { dx: this.eye.x, dy: this.eye.y, blink: this.blink, flat: 0 });
    this.paint(this.grid, this.grid.buf, this.bright);

    const glow = this.glowRef.current;
    if (glow) glow.style.opacity = (this.awake ? (idle ? 0.32 : 0.55 + breath * 0.45) : 0.22).toFixed(3);
    const cue = this.cueRef.current;
    if (cue) cue.style.opacity = (this.awake ? 0.45 + breath * 0.4 : 0.25).toFixed(3);
  }

  renderVals() {
    return {
      rootRef: this.rootRef, gridRef: this.gridRef, copyRef: this.copyRef,
      glowRef: this.glowRef, cueRef: this.cueRef
    };
  }
}
</script>
</body>
</html>
