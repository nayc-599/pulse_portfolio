<header style="position:sticky;top:0;z-index:50;background:rgba(var(--bone-rgb),0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule-bone-12)">
  <div class="wrap" style="padding:var(--header-pad);display:flex;align-items:center;gap:24px;flex-wrap:wrap">
    <a href="/" class="lockup" style="flex:0 0 auto">
      <img class="mdn-mark--light" src="/assets/brand/mdn-mark-purple.png" alt="Monash DeepNeuron" style="height:26px;width:auto;display:block" />
      <img class="mdn-mark--dark" src="/assets/brand/mdn-mark-white.png" alt="Monash DeepNeuron" style="height:26px;width:auto;display:block" />
      <span class="lockup__divider"></span>
      <span class="pixel-grid" data-pixel-grid data-pattern="face" data-n="5" data-live="true" style="padding:4px">
        <span class="pixel-grid__cells" style="display:grid;grid-template-columns:repeat(5,3px);grid-auto-rows:3px;gap:1px"></span>
      </span>
      <span class="lockup__text">
        <span class="lockup__title">Pulse</span>
        <span class="lockup__sub is-plain">A Monash DeepNeuron project</span>
      </span>
    </a>
    <div class="header-status-wrap">
      <span class="metadata header-status is-plain">{{ site.headerStatus }}</span>
    </div>
    <nav aria-label="Primary" style="flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap">
      {% for l in site.nav %}
      <a href="{{ l.href }}" class="nav-link"{% if (l.href == '/' and page.url == '/') or (l.href != '/' and page.url.startsWith(l.href)) %} aria-current="page"{% endif %}>{{ l.label }}</a>
      {% endfor %}
      <button type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Dark mode" data-theme-switch>
        <span class="theme-switch__label" aria-hidden="true">Dark</span>
        <span class="theme-switch__track" aria-hidden="true"><span class="theme-switch__knob"></span></span>
      </button>
    </nav>
  </div>
</header>
