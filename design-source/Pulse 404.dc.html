<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Not found — Pulse</title>
  <meta name="description" content="That page does not exist. The device is asleep." />
  <meta property="og:title" content="Not found — Pulse" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #F4F1EA; color: #1C1A17; font-family: 'General Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    p { text-wrap: pretty; }
    a { color: #6845F0; }
    a:hover { color: #5433DB; }
    :focus-visible { outline: 2px solid #F5C86B; outline-offset: 3px; }
  </style>
</helmet>

<dc-import name="Site Header" active="" hint-size="100%,90px"></dc-import>

<main style="background:#1C1A17;color:#F4F1EA;min-height:64vh;display:flex;align-items:center;justify-content:center;padding:96px 24px;position:relative;overflow:hidden">
  <img src="../assets/wireframes/wf-melt-purple.png" alt="" aria-hidden="true" style="position:absolute;left:-140px;bottom:-160px;width:520px;opacity:0.09;pointer-events:none" />
  <div style="max-width:560px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;position:relative">
    <dc-import name="Pixel Grid" pattern="asleep" n="{{ n11 }}" cell="{{ c12 }}" gap="{{ g3 }}" pad="20px" hint-size="200px,200px"></dc-import>
    <span style="font:400 11px/1 'Space Mono',monospace;letter-spacing:0.2em;color:#A996FE">ERROR 404 · EYES CLOSED</span>
    <h1 style="margin:0;font:500 clamp(32px,5vw,46px)/1.1 'General Sans',system-ui,sans-serif;letter-spacing:-0.03em">There is nothing at this address.</h1>
    <p style="margin:0;font:400 17px/1.7 'General Sans',system-ui,sans-serif;color:rgba(244,241,234,0.72)">Either we moved something without leaving a note, or the link was wrong. Both are plausible.</p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
      <a href="Pulse Home.dc.html" style="font:400 13px/1 'Space Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;color:#1C1A17;background:#F5C86B;padding:15px 22px;transition:transform 900ms cubic-bezier(0.37,0,0.63,1)" style-hover="transform:translateY(-3px)">Back home</a>
      <a href="Pulse Journal.dc.html" style="font:400 13px/1 'Space Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;color:#F4F1EA;border:1px solid rgba(244,241,234,0.4);padding:15px 22px;transition:border-color 900ms cubic-bezier(0.37,0,0.63,1)" style-hover="border-color:#F5C86B">Read the journal</a>
    </div>
  </div>
</main>

<dc-import name="Site Footer" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return { n11: 11, c12: 12, g3: 3 }; }
}
</script>
</body>
</html>
